<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天吃什麼轉盤 🍙</title>
<style>
  :root{
    --bg1:#fff3f0; --bg2:#fff9e8;
    --card:#ffffff; --ink:#6b4f4f; --soft:#b99a9a;
    --pink:#ff9aa8; --pink-d:#f4778a; --mint:#a8e6cf; --butter:#ffe29a;
    --shadow:0 8px 24px rgba(244,119,138,.18);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    background-attachment:fixed;
  }
  .wrap{max-width:960px; margin:0 auto; padding:24px 16px 48px}
  header{text-align:center; margin-bottom:20px}
  h1{margin:0; font-size:2rem; letter-spacing:2px}
  header p{margin:6px 0 0; color:var(--soft)}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:20px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card); border-radius:24px; padding:20px; box-shadow:var(--shadow)}
  .card h2{margin:0 0 12px; font-size:1.1rem}

  /* wheel */
  .wheel-box{position:relative; width:100%; max-width:380px; margin:0 auto; aspect-ratio:1}
  canvas{width:100%; height:100%; display:block}
  .pointer{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    font-size:2rem; filter:drop-shadow(0 3px 2px rgba(0,0,0,.15)); z-index:2;
  }
  .hub{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:64px; height:64px; border-radius:50%; border:none; cursor:pointer;
    background:var(--pink); color:#fff; font-weight:700; font-size:1rem;
    box-shadow:0 4px 0 var(--pink-d), 0 8px 16px rgba(0,0,0,.15);
    transition:transform .1s;
  }
  .hub:active{transform:translate(-50%,-46%)}
  .hub:disabled{background:#ddd; box-shadow:0 4px 0 #bbb; cursor:not-allowed}
  .msg{text-align:center; min-height:1.4em; color:var(--soft); margin:10px 0 0}

  /* result */
  .result{
    margin-top:14px; text-align:center; padding:16px; border-radius:20px;
    background:linear-gradient(135deg,#fff0f3,#fff8de); display:none;
  }
  .result.show{display:block; animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  .result .emoji{font-size:3.2rem; line-height:1}
  .result .name{font-size:1.6rem; font-weight:700; margin:6px 0}
  .btns{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
  button.b{
    border:none; border-radius:999px; padding:9px 18px; font-size:.95rem; cursor:pointer;
    background:var(--mint); color:#3f6b5a; font-weight:600;
  }
  button.b.pink{background:var(--pink); color:#fff}
  button.b.ghost{background:#f5eeee; color:var(--soft)}
  button.b:hover{filter:brightness(1.05)}
  @keyframes pop{from{transform:scale(.6); opacity:0}to{transform:scale(1); opacity:1}}

  /* chips */
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px}
  .chip{
    border:2px solid #f3dede; background:#fff; color:var(--soft); border-radius:999px;
    padding:5px 12px; cursor:pointer; font-size:.9rem; user-select:none;
  }
  .chip.on{background:var(--butter); border-color:var(--butter); color:#7a6420; font-weight:600}

  /* list */
  .list{max-height:260px; overflow:auto; margin:0; padding:0; list-style:none}
  .list li{
    display:flex; align-items:center; gap:8px; padding:7px 4px;
    border-bottom:1px dashed #f3e4e4;
  }
  .list li.off .nm{opacity:.35; text-decoration:line-through}
  .list .nm{flex:1}
  .list .tag{font-size:.75rem; color:var(--soft); background:#faf3f3; padding:2px 8px; border-radius:99px}
  .list input[type=checkbox]{accent-color:var(--pink-d); width:18px; height:18px}
  .x{border:none; background:none; color:#d6b4b4; cursor:pointer; font-size:1.1rem}
  .x:hover{color:var(--pink-d)}
  .add{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap}
  .add input,.add select{
    border:2px solid #f3dede; border-radius:14px; padding:8px 10px; font-size:.95rem;
    color:var(--ink); background:#fff; min-width:0;
  }
  .add input{flex:1 1 120px}
  .hist{margin:0; padding-left:0; list-style:none; display:flex; flex-wrap:wrap; gap:6px}
  .hist li{background:#f2fbf6; color:#3f6b5a; padding:4px 10px; border-radius:99px; font-size:.9rem}
  .hist-empty{color:var(--soft); font-size:.9rem}
  footer{text-align:center; color:var(--soft); font-size:.85rem; margin-top:24px}

  /* confetti */
  .confetti{position:fixed; top:-20px; font-size:1.4rem; pointer-events:none; z-index:50; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg); opacity:.6}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🍙 今天吃什麼轉盤</h1>
    <p>選擇困難症救星，轉一下就決定！</p>
  </header>

  <div class="grid">
    <!-- 左：轉盤 -->
    <section class="card">
      <div class="wheel-box">
        <div class="pointer">🔻</div>
        <canvas id="wheel"></canvas>
        <button class="hub" id="spin">轉！</button>
      </div>
      <p class="msg" id="msg"></p>
      <div class="result" id="result">
        <div class="emoji" id="rEmoji"></div>
        <div class="name" id="rName"></div>
        <div class="btns">
          <button class="b pink" id="accept">就吃這個！</button>
          <button class="b" id="again">再轉一次</button>
          <button class="b ghost" id="skip">今天不想吃這個</button>
        </div>
      </div>
    </section>

    <!-- 右：設定 -->
    <section class="card">
      <h2>🍱 想吃哪一類？</h2>
      <div class="chips" id="chips"></div>

      <h2>📝 選項清單</h2>
      <ul class="list" id="list"></ul>
      <form class="add" id="addForm">
        <input id="newName" placeholder="新增想吃的…（例：滷肉飯）" maxlength="12" required>
        <select id="newCat"></select>
        <button class="b pink" type="submit">加入</button>
      </form>

      <h2 style="margin-top:20px">📅 最近吃過</h2>
      <ul class="hist" id="hist"></ul>
      <div style="margin-top:10px"><button class="b ghost" id="clearHist">清除紀錄</button> <button class="b ghost" id="reset">還原預設清單</button></div>
    </section>
  </div>

  <footer>Made with Vibe Coding 💕 資料只存在你的瀏覽器，不會上傳</footer>
</div>

<script>
(() => {
  const CATS = ["飯類","麵類","小吃","輕食","異國"];
  const DEFAULTS = [
    ["滷肉飯","🍚","飯類"],["雞腿便當","🍱","飯類"],["咖哩飯","🍛","飯類"],["燒肉丼","🥩","飯類"],
    ["牛肉麵","🍜","麵類"],["拉麵","🍥","麵類"],["義大利麵","🍝","麵類"],["乾麵","🥢","麵類"],
    ["鹽酥雞","🍗","小吃"],["水餃","🥟","小吃"],["蚵仔煎","🍳","小吃"],["蔥抓餅","🫓","小吃"],
    ["沙拉","🥗","輕食"],["三明治","🥪","輕食"],["飯糰","🍙","輕食"],
    ["壽司","🍣","異國"],["韓式炸雞","🍖","異國"],["披薩","🍕","異國"],["泰式料理","🌶️","異國"]
  ];
  const COLORS = ["#ffd6dc","#ffe9b8","#d4f3e4","#d9e6ff","#ead9ff","#ffe0cc","#e3f5c6","#ffd9f0"];
  const EMOJI_BY_CAT = {"飯類":"🍚","麵類":"🍜","小吃":"🍢","輕食":"🥗","異國":"🌍"};
  const KEY = "foodWheel.v1";

  const $ = id => document.getElementById(id);
  const canvas = $("wheel"), ctx = canvas.getContext("2d");

  let state = load();
  let rot = 0, spinning = false, current = null;

  function makeDefaults(){
    return {
      items: DEFAULTS.map(([name,emoji,cat],i)=>({id:"d"+i,name,emoji,cat,on:true})),
      cats: Object.fromEntries(CATS.map(c=>[c,true])),
      history: []
    };
  }
  function load(){
    try{
      const s = JSON.parse(localStorage.getItem(KEY));
      if(s && s.items && s.cats && s.history) return s;
    }catch(e){}
    return makeDefaults();
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
  const active = () => state.items.filter(i => i.on && state.cats[i.cat]);

  /* ---------- 轉盤繪製 ---------- */
  function fit(){
    const size = canvas.parentElement.clientWidth;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size*dpr; canvas.height = size*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }
  function draw(){
    const size = canvas.parentElement.clientWidth;
    const c = size/2, r = c-8;
    ctx.clearRect(0,0,size,size);
    const items = active(), n = items.length;

    // 外圈
    ctx.beginPath(); ctx.arc(c,c,r+6,0,Math.PI*2);
    ctx.fillStyle="#fff"; ctx.shadowColor="rgba(244,119,138,.25)"; ctx.shadowBlur=14; ctx.fill();
    ctx.shadowBlur=0;

    if(n < 2){
      ctx.beginPath(); ctx.arc(c,c,r,0,Math.PI*2); ctx.fillStyle="#fff1f1"; ctx.fill();
      ctx.fillStyle="#b99a9a"; ctx.font="16px sans-serif"; ctx.textAlign="center";
      ctx.fillText("至少要選 2 個選項喔", c, c+80);
      return;
    }
    const sl = Math.PI*2/n;
    for(let i=0;i<n;i++){
      const a0 = rot + i*sl, a1 = a0+sl;
      ctx.beginPath(); ctx.moveTo(c,c); ctx.arc(c,c,r,a0,a1); ctx.closePath();
      ctx.fillStyle = COLORS[i%COLORS.length]; ctx.fill();
      ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.stroke();

      // 文字
      ctx.save();
      ctx.translate(c,c); ctx.rotate(a0+sl/2);
      ctx.textAlign="right"; ctx.textBaseline="middle"; ctx.fillStyle="#6b4f4f";
      const fs = Math.max(11, Math.min(18, 240/n+4));
      ctx.font = `600 ${fs}px "PingFang TC","Microsoft JhengHei",sans-serif`;
      let label = items[i].name; if(label.length>6) label = label.slice(0,5)+"…";
      ctx.fillText(label, r-34, 0);
      ctx.font = `${fs+4}px sans-serif`;
      ctx.fillText(items[i].emoji, r-10, 1);
      ctx.restore();
    }
  }

  /* ---------- 轉動 ---------- */
  function pickIndex(n){
    const sl = Math.PI*2/n;
    // 指針在正上方 (-π/2)
    let ang = (-Math.PI/2 - rot) % (Math.PI*2);
    if(ang<0) ang += Math.PI*2;
    return Math.floor(ang/sl) % n;
  }
  function spin(){
    const items = active();
    if(spinning || items.length<2) return;
    spinning = true; $("spin").disabled = true;
    $("result").classList.remove("show");
    $("msg").textContent = "轉轉轉…🌀";
    const start = rot, total = (5+Math.random()*3)*Math.PI*2 + Math.random()*Math.PI*2;
    const dur = 4200, t0 = performance.now();
    const ease = t => 1-Math.pow(1-t,3);
    (function frame(now){
      const t = Math.min(1,(now-t0)/dur);
      rot = start + total*ease(t);
      draw();
      if(t<1) requestAnimationFrame(frame);
      else finish(items);
    })(t0);
  }
  function finish(items){
    spinning = false; $("spin").disabled = false;
    current = items[pickIndex(items.length)];
    $("msg").textContent = "";
    $("rEmoji").textContent = current.emoji;
    $("rName").textContent = current.name;
    $("result").classList.add("show");
    confetti();
  }
  function confetti(){
    const set = ["🎉","✨","🌸","🍡","💖","⭐"];
    for(let i=0;i<22;i++){
      const s = document.createElement("span");
      s.className="confetti"; s.textContent=set[i%set.length];
      s.style.left = Math.random()*100+"vw";
      s.style.animationDuration = (1.8+Math.random()*1.6)+"s";
      s.style.animationDelay = Math.random()*.4+"s";
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),4200);
    }
  }

  /* ---------- 介面 ---------- */
  function render(){
    // chips
    $("chips").innerHTML = "";
    CATS.forEach(cat=>{
      const el = document.createElement("span");
      el.className = "chip"+(state.cats[cat]?" on":"");
      el.textContent = cat;
      el.onclick = ()=>{ if(spinning) return; state.cats[cat]=!state.cats[cat]; save(); render(); };
      $("chips").appendChild(el);
    });
    // list
    $("list").innerHTML = "";
    state.items.forEach(it=>{
      const li = document.createElement("li");
      li.className = (it.on && state.cats[it.cat]) ? "" : "off";
      const cb = document.createElement("input"); cb.type="checkbox"; cb.checked = it.on;
      cb.onchange = ()=>{ if(spinning){cb.checked=it.on;return;} it.on = cb.checked; save(); render(); };
      const nm = document.createElement("span"); nm.className="nm"; nm.textContent = it.emoji+" "+it.name;
      const tag = document.createElement("span"); tag.className="tag"; tag.textContent = it.cat;
      const x = document.createElement("button"); x.className="x"; x.type="button"; x.textContent="✕"; x.title="刪除";
      x.onclick = ()=>{ if(spinning) return; state.items = state.items.filter(o=>o.id!==it.id); save(); render(); };
      li.append(cb,nm,tag,x);
      $("list").appendChild(li);
    });
    // history
    const h = $("hist"); h.innerHTML = "";
    if(!state.history.length){
      h.innerHTML = '<li class="hist-empty" style="background:none">還沒有紀錄，轉一次吧！</li>';
    }else{
      state.history.slice(0,8).forEach(t=>{
        const li = document.createElement("li"); li.textContent = t; h.appendChild(li);
      });
    }
    // 轉盤狀態
    const n = active().length;
    $("spin").disabled = spinning || n<2;
    draw();
  }

  /* ---------- 事件 ---------- */
  $("spin").onclick = spin;
  $("again").onclick = spin;
  $("accept").onclick = ()=>{
    if(!current) return;
    const d = new Date();
    const stamp = `${d.getMonth()+1}/${d.getDate()} ${current.emoji}${current.name}`;
    state.history.unshift(stamp); state.history = state.history.slice(0,30);
    save(); render();
    $("msg").textContent = "好的！吃得開心 😋";
    $("result").classList.remove("show");
  };
  $("skip").onclick = ()=>{
    if(!current) return;
    const it = state.items.find(o=>o.id===current.id);
    if(it){ it.on = false; save(); render(); }
    $("msg").textContent = `已先把「${current.name}」暫時關掉，再轉一次吧`;
    $("result").classList.remove("show");
  };
  $("addForm").onsubmit = e=>{
    e.preventDefault();
    if(spinning) return;
    const name = $("newName").value.trim(); if(!name) return;
    const cat = $("newCat").value;
    if(state.items.some(i=>i.name===name)){ $("msg").textContent="這個選項已經有囉"; return; }
    state.items.push({id:"u"+Date.now(), name, emoji:EMOJI_BY_CAT[cat], cat, on:true});
    state.cats[cat] = true;
    $("newName").value=""; save(); render();
  };
  $("clearHist").onclick = ()=>{ state.history=[]; save(); render(); };
  $("reset").onclick = ()=>{
    if(spinning) return;
    if(confirm("要還原成預設清單嗎？你新增的選項會消失。")){ state = makeDefaults(); save(); render(); }
  };

  CATS.forEach(c=>{ const o=document.createElement("option"); o.value=o.textContent=c; $("newCat").appendChild(o); });
  window.addEventListener("resize", fit);
  render(); fit();
})();
</script>
</body>
</html>
